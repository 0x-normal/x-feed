[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "x-engine"
version = "0.1.0"
description = "X Feed: X activity tracking with an encrypted account vault"
requires-python = ">=3.11"
dependencies = ["twifork==2.4.0", "cryptography>=46,<49"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
x-feed = "x_engine.cli:main"
x-engine = "x_engine.cli:main"

[tool.setuptools.package-data]
x_engine = ["dashboard.html"]

[tool.setuptools.packages.find]
include = ["x_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
